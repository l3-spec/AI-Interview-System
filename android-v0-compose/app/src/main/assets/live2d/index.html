<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Live2D WebView</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
        canvas { display: block; width: 100%; height: 100%; }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #aaa;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 13px;
            text-align: center;
            line-height: 1.6;
            z-index: 10;
            pointer-events: none;
        }
        #diag {
            position: absolute;
            top: 10px; left: 10px;
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            z-index: 20;
            pointer-events: none;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="loading">Loading PIXI.js from CDN...</div>
    <div id="diag"></div>

    <!-- Load PIXI.js from CDN (avoids local asset loading issues in WebView) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>
    <!-- Load pixi-live2d from local (smaller, OK from assets) -->
    <script src="pixi-live2d.min.js"></script>
    <!-- Load Cubism Core from local -->
    <script src="live2dcubismcore.min.js"></script>
    <!-- Load our app -->
    <script src="app.js"></script>
</body>
</html>
