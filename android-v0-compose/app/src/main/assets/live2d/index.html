<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Live2D WebView</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; width: 100%; height: 100%; }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #aaa; font-family: -apple-system, sans-serif;
            font-size: 13px; text-align: center; line-height: 1.8;
            z-index: 10; pointer-events: none;
        }
        #diag {
            position: absolute; top: 4px; left: 4px;
            color: #0f0; font-family: monospace; font-size: 10px;
            z-index: 20; pointer-events: none;
            background: rgba(0,0,0,0.8);
            padding: 4px 6px; border-radius: 3px;
            max-width: 95%; word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="loading">Loading...</div>
    <div id="diag"></div>

    <!-- All from local assets — no CDN needed -->
    <script src="pixi.min.js"></script>
    <script src="live2dcubismcore.min.js"></script>
    <script src="pixi-live2d.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
