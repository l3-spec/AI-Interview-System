user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # 上传文件大小限制（与后端保持一致）
    client_max_body_size 100m;

    # WebSocket 升级头
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── 上游服务定义 ─────────────────────────────────────────
    upstream backend_api {
        server backend-api:3001;
        keepalive 32;
    }

    upstream asr_service {
        server asr-service:3002;
        keepalive 16;
    }

    upstream tts_service {
        server tts-service:3003;
        keepalive 16;
    }

    upstream interview_service {
        server interview-service:3004;
        keepalive 16;
    }

    upstream analysis_service {
        server analysis-service:3005;
        keepalive 16;
    }

    # ── HTTP → HTTPS 重定向 ──────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── 主 HTTPS 服务器 ──────────────────────────────────────
    server {
        listen 443 ssl;
        server_name your-domain.com;  # 替换为你的域名

        # SSL 证书（在服务器上配置后替换路径）
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── 主后端 API ────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── 主后端 WebSocket（Socket.IO）────────────────────
        location /socket.io/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── ASR WebSocket ─────────────────────────────────────
        location /asr/ {
            proxy_pass http://asr_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ── TTS WebSocket ─────────────────────────────────────
        location /tts/ {
            proxy_pass http://tts_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ── Interview Service ─────────────────────────────────
        location /interview/ {
            proxy_pass http://interview_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ── Analysis Service ──────────────────────────────────
        location /analysis/ {
            proxy_pass http://analysis_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        # ── 健康检查（无需鉴权）──────────────────────────────
        location /health {
            proxy_pass http://backend_api/health;
            access_log off;
        }

        # ── 静态文件上传目录 ──────────────────────────────────
        location /uploads/ {
            alias /app/uploads/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
